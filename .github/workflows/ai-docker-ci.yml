name: AI Docker CI

on:
  pull_request:
    paths:
      - "ai/**"
      - "detector/**"
      - "messaging/**"
      - "rules/**"
      - "scripts/**"
      - "stream/**"
      - "tracking/**"
      - "tests/**"
      - "docs/docker.md"
      - ".env.example"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.ai.yml"
      - ".github/workflows/ai-docker-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "ai/**"
      - "detector/**"
      - "messaging/**"
      - "rules/**"
      - "scripts/**"
      - "stream/**"
      - "tracking/**"
      - "tests/**"
      - "docs/docker.md"
      - ".env.example"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.ai.yml"
      - ".github/workflows/ai-docker-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  python-and-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Python syntax check
        run: python -m compileall ai detector messaging rules scripts stream tracking

      - name: Run AI tests
        run: pytest tests

      # --- Docker Advanced CI/CD (Backend Develop Level) ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/strange-ai
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and export to Docker daemon (for testing)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: strange-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose config
        run: docker compose -f docker-compose.ai.yml config

      - name: Container import smoke test
        run: docker run --rm strange-ai:ci python -c "from ai.registered_cameras import RunnerConfig; from scripts.run_registered_cameras import parse_args; print(parse_args(['--dry-run','--skip-rtsp-probe']).dry_run)"

      - name: Container entrypoint dry-run
        run: docker run --rm strange-ai:ci python scripts/run_registered_cameras.py --dry-run --skip-rtsp-probe --backend-timeout-seconds 0.1

      - name: Push image to GHCR (After successful tests)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
