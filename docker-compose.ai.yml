name: strange-ai

services:
  strange-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: strange-ai:local
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:18080}
      MQTT_HOST: ${MQTT_HOST:-host.docker.internal}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-safety/events}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MEDIAMTX_RTSP_BASE_URL: ${MEDIAMTX_RTSP_BASE_URL:-rtsp://host.docker.internal:8554}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/models/yolo26n-pose.pt}
      MODEL_CHECKPOINT_PATH: ${MODEL_CHECKPOINT_PATH:-/models/lstm.pt}
      VIDEO_POOL_DIR: ${VIDEO_POOL_DIR:-/data/videos}
      EVENT_CLIP_OUTPUT_DIR: ${EVENT_CLIP_OUTPUT_DIR:-/app/runs/clips}
      SEQUENCE_LENGTH: ${SEQUENCE_LENGTH:-30}
      SEQUENCE_STRIDE: ${SEQUENCE_STRIDE:-15}
      FFMPEG_MODE: ${FFMPEG_MODE:-auto}
      CAMERA_POLL_INTERVAL_SECONDS: ${CAMERA_POLL_INTERVAL_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEVICE: ${DEVICE:-auto}
      ACTION_DEVICE: ${ACTION_DEVICE:-auto}
      DETECTOR_MODE: ${DETECTOR_MODE:-real}
      TRACKING_MODE: ${TRACKING_MODE:-supervision}
      MJPEG_ENABLED: ${MJPEG_ENABLED:-true}
      MJPEG_PORT: ${MJPEG_PORT:-8010}
      MJPEG_FPS: ${MJPEG_FPS:-8}
      MJPEG_WIDTH: ${MJPEG_WIDTH:-640}
      MJPEG_HEIGHT: ${MJPEG_HEIGHT:-360}
      MJPEG_JPEG_QUALITY: ${MJPEG_JPEG_QUALITY:-70}
      MJPEG_BASE_PATH: ${MJPEG_BASE_PATH:-/mjpeg}
      MJPEG_ENABLE_OVERLAY: ${MJPEG_ENABLE_OVERLAY:-false}
    ports:
      - "${MJPEG_PORT:-8010}-${MJPEG_PORT_END:-8020}:${MJPEG_PORT:-8010}-${MJPEG_PORT_END:-8020}"
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
      - type: bind
        source: ./sample_videos
        target: /data/videos
        read_only: true
      - type: volume
        source: strange_ai_runs
        target: /app/runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - python
      - scripts/run_registered_cameras.py
    restart: unless-stopped
    # GPU example:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # environment:
    #   DEVICE: "0"
    #   ACTION_DEVICE: "0"

volumes:
  strange_ai_runs:
