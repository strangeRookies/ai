<!DOCTYPE html>
<html>
<head>
    <title>Streaming Benchmark Test</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; }
        video { background: #000; border: 2px solid #333; margin-top: 20px; }
        #log { margin-top: 20px; width: 800px; height: 150px; background: #222; overflow-y: scroll; padding: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <h2>Streaming Benchmark</h2>
    <video id="videoPlayer" muted controls width="800" height="450"></video>
    <div id="log"></div>

    <script>
        // Global stats object
        window.benchmarkStats = {
            startTime: null,
            firstFrameTime: null,
            ttff_ms: null,
            status: "READY", // READY, RUNNING, SUCCESS, FAILED
            error_reason: null,
            buffering_count: 0,
            frames_decoded: 0,
            dropped_frames: 0,
            bytes_received: 0,
            packets_lost: 0,
            jitter: 0,
            timeline: {
                trigger_time: null,
                hls_attach_time: null,
                whep_post_start_time: null,
                whep_post_success_time: null,
                ice_gathering_complete_time: null,
                ice_connected_time: null,
                ontrack_time: null,
                video_playing_time: null,
                first_frame_callback_time: null,
                first_decoded_frame_time: null
            }
        };

        window.benchmarkReady = false;

        const video = document.getElementById('videoPlayer');
        const logEl = document.getElementById('log');
        let webrtcPeerConnection = null;

        const params = new URLSearchParams(window.location.search);
        const streamUrl = params.get('url');
        const mode = params.get('mode');

        function log(msg) {
            console.log(msg);
            logEl.innerHTML += `<div>[${new Date().toISOString().split('T')[1].slice(0,-1)}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // 1. Ready flag set
        if (streamUrl && mode) {
            log(`Page loaded in READY state. Mode: ${mode}, URL: ${streamUrl}`);
            window.benchmarkReady = true;
        } else {
            log("[ERROR] Missing 'url' or 'mode' query parameter");
            window.benchmarkStats.status = "FAILED";
            window.benchmarkStats.error_reason = "MISSING_PARAMS";
        }

        // 2. Play trigger mapping
        window.__START_BENCHMARK__ = function() {
            if (window.benchmarkStats.status === "FAILED") {
                log("[ERROR] Cannot start. Current status is FAILED");
                return;
            }
            const triggerTime = Date.now();
            window.benchmarkStats.startTime = triggerTime;
            window.benchmarkStats.timeline.trigger_time = triggerTime;
            window.benchmarkStats.status = "RUNNING";
            log(`[TRIGGER] Benchmark started at ${triggerTime}`);

            // Setup requestVideoFrameCallback
            if ('requestVideoFrameCallback' in video) {
                const onFrame = () => {
                    if (window.benchmarkStats.timeline.first_frame_callback_time === null) {
                        window.benchmarkStats.timeline.first_frame_callback_time = Date.now();
                        log(`[rvfc] First video frame callback received at ${window.benchmarkStats.timeline.first_frame_callback_time}`);
                        checkFirstFrame();
                    }
                };
                video.requestVideoFrameCallback(onFrame);
            }

            if (mode === 'hls') {
                startHLS(streamUrl);
            } else if (mode === 'webrtc') {
                startWebRTC(streamUrl);
            }
        };

        function checkFirstFrame() {
            if (window.benchmarkStats.status === "FAILED") return;
            if (window.benchmarkStats.ttff_ms !== null) return;

            let firstFrameTime = null;
            if (mode === 'hls') {
                const playTime = window.benchmarkStats.timeline.video_playing_time;
                const callbackTime = window.benchmarkStats.timeline.first_frame_callback_time;
                if (playTime || callbackTime) {
                    firstFrameTime = Math.min(playTime || Infinity, callbackTime || Infinity);
                }
            } else if (mode === 'webrtc') {
                const decodedTime = window.benchmarkStats.timeline.first_decoded_frame_time;
                const callbackTime = window.benchmarkStats.timeline.first_frame_callback_time;
                if (decodedTime || callbackTime) {
                    firstFrameTime = Math.min(decodedTime || Infinity, callbackTime || Infinity);
                }
            }

            if (firstFrameTime && firstFrameTime !== Infinity) {
                window.benchmarkStats.firstFrameTime = firstFrameTime;
                window.benchmarkStats.ttff_ms = firstFrameTime - window.benchmarkStats.startTime;
                window.benchmarkStats.status = "SUCCESS";
                log(`[TTFF] First frame rendered in ${Math.round(window.benchmarkStats.ttff_ms)} ms (TTFF)`);
            }
        }

        // HLS Load & Play
        function startHLS(url) {
            log(`[HLS] Loading source...`);
            window.benchmarkStats.timeline.hls_attach_time = Date.now();
            if (Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 5,
                    maxMaxBufferLength: 10,
                    liveSyncDurationCount: 2
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => {
                        window.benchmarkStats.status = "FAILED";
                        window.benchmarkStats.error_reason = "VIDEO_PLAY_FAILED";
                        log(`[ERROR] video.play() failed: ${e.message}`);
                    });
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        window.benchmarkStats.status = "FAILED";
                        window.benchmarkStats.error_reason = "HLS_PLAY_FAILED";
                        log(`[ERROR] HLS fatal error: ${data.type}`);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(e => {
                    window.benchmarkStats.status = "FAILED";
                    window.benchmarkStats.error_reason = "HLS_PLAY_FAILED";
                });
            }
        }

        // WebRTC WHEP connection
        async function startWebRTC(url) {
            log(`[WebRTC] Starting WHEP connection...`);
            window.benchmarkStats.timeline.whep_post_start_time = Date.now();
            webrtcPeerConnection = new RTCPeerConnection();
            
            webrtcPeerConnection.addTransceiver('video', {direction: 'recvonly'});
            
            webrtcPeerConnection.oniceconnectionstatechange = () => {
                const state = webrtcPeerConnection.iceConnectionState;
                log(`ICE Connection State Changed: ${state}`);
                if (state === 'connected' || state === 'completed') {
                    window.benchmarkStats.timeline.ice_connected_time = Date.now();
                } else if (state === 'failed') {
                    window.benchmarkStats.status = "FAILED";
                    window.benchmarkStats.error_reason = "ICE_FAILED";
                }
            };
            
            webrtcPeerConnection.ontrack = (event) => {
                window.benchmarkStats.timeline.ontrack_time = Date.now();
                log('Received WebRTC track');
                if (event.streams && event.streams[0]) {
                    video.srcObject = event.streams[0];
                } else {
                    window.benchmarkStats.status = "FAILED";
                    window.benchmarkStats.error_reason = "NO_REMOTE_TRACK";
                }
                video.play().catch(e => {
                    window.benchmarkStats.status = "FAILED";
                    window.benchmarkStats.error_reason = "VIDEO_PLAY_FAILED";
                });
            };

            try {
                const offer = await webrtcPeerConnection.createOffer();
                await webrtcPeerConnection.setLocalDescription(offer);

                await new Promise((resolve) => {
                    if (webrtcPeerConnection.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        const checkState = () => {
                            if (webrtcPeerConnection.iceGatheringState === 'complete') {
                                webrtcPeerConnection.removeEventListener('icegatheringstatechange', checkState);
                                resolve();
                            }
                        };
                        webrtcPeerConnection.addEventListener('icegatheringstatechange', checkState);
                        setTimeout(resolve, 3000);
                    }
                });
                
                window.benchmarkStats.timeline.ice_gathering_complete_time = Date.now();

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/sdp'
                    },
                    body: webrtcPeerConnection.localDescription.sdp
                });
                
                if (!response.ok) {
                    throw new Error(`WHEP_POST_FAILED_${response.status}`);
                }
                
                window.benchmarkStats.timeline.whep_post_success_time = Date.now();
                const answerSdp = await response.text();
                await webrtcPeerConnection.setRemoteDescription({ type: 'answer', sdp: answerSdp });
                log('WebRTC WHEP Negotiation Complete.');
            } catch (err) {
                window.benchmarkStats.status = "FAILED";
                window.benchmarkStats.error_reason = err.message || "WHEP_POST_FAILED";
                log(`[ERROR] WebRTC setup failed: ${err.message}`);
            }
        }

        // Listening to playing & waiting events
        video.addEventListener('playing', () => {
            window.benchmarkStats.timeline.video_playing_time = Date.now();
            log(`Video playing event fired at ${window.benchmarkStats.timeline.video_playing_time}`);
            checkFirstFrame();
        });

        video.addEventListener('waiting', () => {
            if (window.benchmarkStats.startTime !== null) {
                window.benchmarkStats.buffering_count++;
                log(`Buffering event count: ${window.benchmarkStats.buffering_count}`);
            }
        });

        // Periodic stats gathering
        setInterval(async () => {
            if (window.benchmarkStats.startTime === null) return;

            // Frame decoded check
            if (video.getVideoPlaybackQuality) {
                const quality = video.getVideoPlaybackQuality();
                window.benchmarkStats.dropped_frames = quality.droppedVideoFrames;
                if (!webrtcPeerConnection) {
                    window.benchmarkStats.frames_decoded = quality.totalVideoFrames;
                    if (quality.totalVideoFrames > 0 && window.benchmarkStats.timeline.first_decoded_frame_time === null) {
                        window.benchmarkStats.timeline.first_decoded_frame_time = Date.now();
                        log(`[HLS] framesDecoded > 0 detected at ${window.benchmarkStats.timeline.first_decoded_frame_time}`);
                        checkFirstFrame();
                    }
                }
            }

            // WebRTC peer connection stats
            if (webrtcPeerConnection) {
                try {
                    const stats = await webrtcPeerConnection.getStats();
                    stats.forEach(report => {
                        if (report.type === 'inbound-rtp' && report.kind === 'video') {
                            window.benchmarkStats.jitter = report.jitter || 0;
                            window.benchmarkStats.packets_lost = report.packetsLost || 0;
                            if (report.framesDecoded) {
                                window.benchmarkStats.frames_decoded = report.framesDecoded;
                                if (report.framesDecoded > 0 && window.benchmarkStats.timeline.first_decoded_frame_time === null) {
                                    window.benchmarkStats.timeline.first_decoded_frame_time = Date.now();
                                    log(`[WebRTC] framesDecoded > 0 detected at ${window.benchmarkStats.timeline.first_decoded_frame_time}`);
                                    checkFirstFrame();
                                }
                            }
                            if (report.bytesReceived) {
                                window.benchmarkStats.bytes_received = report.bytesReceived;
                            }
                        }
                    });
                } catch (e) {
                    // Ignore stats errors
                }
            }
        }, 100);
    </script>
</body>
</html>
