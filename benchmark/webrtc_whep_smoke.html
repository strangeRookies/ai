<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WHEP WebRTC Smoke</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #111; color: #eee; }
    main { max-width: 980px; margin: 24px auto; padding: 0 16px; }
    video { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid #444; }
    label, input, button { font-size: 14px; }
    input { width: min(720px, 100%); padding: 8px; margin: 8px 8px 8px 0; }
    button { padding: 8px 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    td { border-bottom: 1px solid #333; padding: 8px; }
    .pass { color: #70e080; }
    .fail { color: #ff7a7a; }
    pre { min-height: 160px; background: #1d1d1d; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
<main>
  <h1>WHEP WebRTC Smoke</h1>
  <video id="video" autoplay muted playsinline controls></video>
  <div>
    <label for="whepUrl">WHEP URL</label><br>
    <input id="whepUrl" value="http://localhost:8889/cam_01/whep">
    <button id="startButton">Start</button>
  </div>
  <table>
    <tbody id="checks"></tbody>
  </table>
  <pre id="log"></pre>
</main>
<script>
const video = document.getElementById('video');
const checks = document.getElementById('checks');
const logBox = document.getElementById('log');
const state = {
  whepPostOk: false,
  iceConnected: false,
  ontrack: false,
  bytesReceivedIncreased: false,
  framesDecodedIncreased: false,
  videoPlaying: false,
  bytesReceived: 0,
  framesDecoded: 0,
  iceConnectionState: 'new',
  error: ''
};
let peerConnection = null;
let baselineBytes = null;
let baselineFrames = null;

function log(message) {
  const line = `[${new Date().toISOString()}] ${message}`;
  console.log(line);
  logBox.textContent += `${line}\n`;
  logBox.scrollTop = logBox.scrollHeight;
}

function renderChecks() {
  const rows = [
    ['WHEP POST success', state.whepPostOk],
    ['ICE connected/completed', state.iceConnected, state.iceConnectionState],
    ['ontrack fired', state.ontrack],
    ['bytesReceived increased', state.bytesReceivedIncreased, state.bytesReceived],
    ['framesDecoded increased', state.framesDecodedIncreased, state.framesDecoded],
    ['video playing event', state.videoPlaying]
  ];
  checks.innerHTML = rows.map(([name, pass, value]) => `
    <tr>
      <td>${name}</td>
      <td class="${pass ? 'pass' : 'fail'}">${pass ? 'PASS' : 'WAIT'}</td>
      <td>${value ?? ''}</td>
    </tr>
  `).join('');
  window.webrtcSmokeResult = { ...state };
}

async function waitForIceGatheringComplete(pc) {
  if (pc.iceGatheringState === 'complete') return;
  await new Promise(resolve => {
    const timeout = setTimeout(resolve, 3000);
    pc.addEventListener('icegatheringstatechange', () => {
      if (pc.iceGatheringState === 'complete') {
        clearTimeout(timeout);
        resolve();
      }
    });
  });
}

async function collectStats() {
  if (!peerConnection) return;
  const stats = await peerConnection.getStats();
  stats.forEach(report => {
    if (report.type === 'inbound-rtp' && report.kind === 'video') {
      state.bytesReceived = report.bytesReceived || 0;
      state.framesDecoded = report.framesDecoded || 0;
      if (baselineBytes === null) baselineBytes = state.bytesReceived;
      if (baselineFrames === null) baselineFrames = state.framesDecoded;
      state.bytesReceivedIncreased = state.bytesReceived > baselineBytes;
      state.framesDecodedIncreased = state.framesDecoded > baselineFrames;
    }
  });
  renderChecks();
}

async function startWhep(url) {
  if (peerConnection) peerConnection.close();
  logBox.textContent = '';
  Object.assign(state, {
    whepPostOk: false,
    iceConnected: false,
    ontrack: false,
    bytesReceivedIncreased: false,
    framesDecodedIncreased: false,
    videoPlaying: false,
    bytesReceived: 0,
    framesDecoded: 0,
    iceConnectionState: 'new',
    error: ''
  });
  baselineBytes = null;
  baselineFrames = null;
  renderChecks();

  peerConnection = new RTCPeerConnection();
  peerConnection.addTransceiver('video', { direction: 'recvonly' });
  peerConnection.oniceconnectionstatechange = () => {
    state.iceConnectionState = peerConnection.iceConnectionState;
    state.iceConnected = ['connected', 'completed'].includes(peerConnection.iceConnectionState);
    log(`ICE connectionState=${peerConnection.iceConnectionState}`);
    renderChecks();
  };
  peerConnection.ontrack = event => {
    state.ontrack = true;
    video.srcObject = event.streams[0];
    log('ontrack fired');
    video.play().catch(error => log(`video.play failed: ${error.message}`));
    renderChecks();
  };
  video.onplaying = () => {
    state.videoPlaying = true;
    log('video playing');
    renderChecks();
  };

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  await waitForIceGatheringComplete(peerConnection);

  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/sdp' },
    body: peerConnection.localDescription.sdp
  });
  state.whepPostOk = response.ok;
  log(`WHEP POST status=${response.status}`);
  if (!response.ok) {
    state.error = await response.text();
    renderChecks();
    throw new Error(`WHEP POST failed: ${response.status}`);
  }
  await peerConnection.setRemoteDescription({ type: 'answer', sdp: await response.text() });
  log('remote SDP answer applied');
  renderChecks();
}

document.getElementById('startButton').addEventListener('click', () => {
  startWhep(document.getElementById('whepUrl').value).catch(error => {
    state.error = error.message;
    log(`ERROR ${error.message}`);
    renderChecks();
  });
});

setInterval(() => collectStats().catch(error => log(`stats error: ${error.message}`)), 1000);
renderChecks();

const params = new URLSearchParams(window.location.search);
if (params.get('url')) {
  document.getElementById('whepUrl').value = params.get('url');
  startWhep(params.get('url')).catch(error => {
    state.error = error.message;
    log(`ERROR ${error.message}`);
    renderChecks();
  });
}
</script>
</body>
</html>
